name: Validate wagering processor
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait postgres localstack
      - run: bun run format:check
      - run: bun run test:all
      - if: failure()
        run: docker compose logs postgres localstack
      - if: always()
        run: docker compose down
